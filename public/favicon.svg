<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="metazap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="metazap-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.75" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- High-contrast brand squircle badge (visible on both Light and Dark mode browser tabs) -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#metazap-grad)" />

  <!-- Shield Frame: Privacy & Security (crisp white) -->
  <path
    d="M16 4.8 L7.8 7.9 V14.2 C7.8 19.4 11.3 24.3 16 25.5 C20.7 24.3 24.2 19.4 24.2 14.2 V7.9 L16 4.8 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />

  <!-- Electric Zap Lightning Bolt: Fast metadata stripping (MetaZap Amber Gold) -->
  <path
    d="M17.2 9.2 L12.5 15.2 H16.5 L14.5 21.2 L20.2 14.2 H16.2 L17.2 9.2 Z"
    fill="#fbbf24"
    stroke="#d97706"
    stroke-width="0.75"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#metazap-glow)"
  />
</svg>
